description: |
  评估治疗剂的靶组织递送效率（delivery_efficiency），侧重三个维度：
  - 屏障穿透与生物利用度（50%）——CNS 靶点评估 BBB 穿透，肠-脑轴靶点评估肠道吸收/滞留；
    生物制剂评估有效靶点接触而非被动扩散
  - 靶向性与可设计性（30%）
  - 暴露持续性与给药便利性（20%）

  输出 JSON 格式评估报告。
expected_output: |
  JSON 格式的递送效率评估报告，包含 delivery_efficiency 评分（1-10）、
  主要递送瓶颈、可设计性说明与 AD 治疗相关性简述。
user_requirement_prefix: "需要评估靶组织递送效率的治疗剂信息："
